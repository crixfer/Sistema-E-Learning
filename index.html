<!-- Caso 3: Sistema de E-learning para una Escuela de Idiomas -->
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>E-learning Escuela de Idiomas</title>
  </head>
  <body>
    <header>
      <img
        src="./imagenes/BLISS OFFICIAL LOGO SMALL PNG (1).png"
        style="width: 100px"
        alt="Logo"
      />
      <h1>BLISS</h1>
    </header>

    <main>
      <img
        src="./imagenes/teaching 2.jpg"
        alt="E-learning Idiomas"
        style="width: 700px; height: auto"
      />

      <p>
        Permite la creación y gestión de cursos online, la interacción entre
        estudiantes y profesores, y el seguimiento del avance educativo.
      </p>

      <table border="1" cellpadding="5" cellspacing="0">
        <tr>
          <th>Curso</th>
          <th>Duración</th>
          <th>Profesor</th>
        </tr>
        <tr>
          <td>Inglés Básico</td>
          <td>3 meses</td>
          <td>John Doe</td>
        </tr>
        <tr>
          <td>Francés Intermedio</td>
          <td>4 meses</td>
          <td>Marie Curie</td>
        </tr>
      </table>

      <h2>Inscribirse en Curso</h2>
      <form>
        Nombre: <input type="text" name="nombre" /><br /><br />
        Curso: <input type="text" name="curso" /><br /><br />
        <button type="submit">Inscribirse</button>
      </form>
    </main>

    <footer>
      <i class="fa fa-copyright" aria-hidden="true">Copyright Bliss 2025</i>
    </footer>
  </body>
</html>
